name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DPUNCH2PEN_BUILD_PLUGIN=OFF
      - name: Build test targets
        run: cmake --build build --target databaseManagerTest profileManagerTest protocolSerializationTest openAIJsonTest transcriptionCoordinatorTest transcriptTimingTest -j4
      - name: Run tests
        run: |
          ./build/bin/databaseManagerTest
          ./build/bin/profileManagerTest
          ./build/bin/protocolSerializationTest
          ./build/bin/openAIJsonTest
          ./build/bin/transcriptionCoordinatorTest
          ./build/bin/transcriptTimingTest

  plugin-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with plugin
        run: cmake -S . -B build -DPUNCH2PEN_BUILD_PLUGIN=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build plugin test targets
        run: cmake --build build --config Release --target ringBufferTest ipcClientTest pluginProcessorStateTest -j4
      - name: Run plugin tests
        run: |
          ./build/plugin/ringBufferTest_artefacts/Release/ringBufferTest
          ./build/plugin/ipcClientTest_artefacts/Release/ipcClientTest
          ./build/plugin/pluginProcessorStateTest_artefacts/Release/pluginProcessorStateTest
      - name: Build AU, VST3, and engine
        run: cmake --build build --config Release --target punch2penEngine punch2pen_plugin_AU punch2pen_plugin_VST3 -j4
      - name: Check engine rpath is relocatable
        run: |
          chmod +x scripts/check_engine_rpath.sh
          ./scripts/check_engine_rpath.sh build/bin/punch2penEngine
      - name: Package unsigned macOS installer
        run: ./installer/macos/build_pkg.sh --skip-build --build-dir build
      - name: auval
        run: |
          echo "Skipping auval on GitHub-hosted macos runners (no signed AU host session)."
          echo "After install on a Mac: auval -strict -v aufx P2pn Dcta"
