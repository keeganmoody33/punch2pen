# Deploy punch2pen.com from CI (no Wrangler browser login).
# Not macOS plugin CI. Concurrency group includes github.workflow, matching
# .github/workflows/ci.yml, so a site deploy does not cancel engine jobs and
# an engine push does not cancel this workflow.
name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing repo Actions secret CLOUDFLARE_API_TOKEN." >&2
            missing=1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing repo Actions secret CLOUDFLARE_ACCOUNT_ID." >&2
            echo "Use the account that lists punch2pen.com (NS irma / jonah)." >&2
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Settings → Secrets and variables → Actions. Then re-run Deploy site." >&2
            echo "Do not change DNS by hand; wrangler custom domains create apex + www." >&2
            exit 1
          fi
          echo "Cloudflare secrets are present (values not logged)."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Site copy gates
        run: |
          chmod +x ./check.sh
          ./check.sh

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
